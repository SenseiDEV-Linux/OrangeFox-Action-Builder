name: OrangeFox - Build

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch (the sync script supports 16.0 / 14.1 / 12.1 only)'
        required: true
        default: '12.1'
        type: choice
        options:
        - 16.0
        - 14.1
        - 12.1
      DEVICE_TREE:
        description: 'OrangeFox Device Tree (full https:// URL)'
        required: true
        default: 'https://github.com/SenseiDEV-Linux/android_device_xiaomi_umi_TWRP'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch (must exist! available: fox12.1-a17 / twrp / fbev1)'
        required: true
        default: 'fox12.1-a17'
      DEVICE_PATH:
        description: 'Device Path (device/<vendor>/<codename>)'
        required: true
        default: 'device/xiaomi/apollo'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'apollo'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      EXTRA_REPOS:
        description: 'Optional. One repo per line: path|url|branch'
        required: false
        default: ''
      CCACHE_BUST:
        description: 'Bump this number to throw away the ccache cache and start cold'
        required: false
        default: '1'

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ---- ccache: the main speed-up on repeated builds ----
      USE_CCACHE: 1
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_MAXSIZE: 6G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_NOHASHDIR: 'true'
      CCACHE_BASEDIR: /home/runner/work
      CCACHE_SLOPPINESS: 'time_macros,include_file_mtime,include_file_ctime,file_stat_matches'
      CCACHE_UMASK: '002'
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Replaces rokibhasansagar/slimhub_actions (it alone took 6.5 min).
    # Same goal - free disk space for the ~40 GB build - but in ~40 seconds.
    - name: Free disk space (fast)
      run: |
        set -euo pipefail
        df -h /
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/share/boost \
          /usr/local/share/chromium \
          /opt/microsoft \
          "$AGENT_TOOLSDIRECTORY" || true
        sudo apt-get clean
        sudo docker image prune -a -f >/dev/null 2>&1 || true
        df -h /

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build Environment
      run: |
        set -euo pipefail
        sudo apt install aria2 ccache zstd -y
        ccache --version | head -1
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    # Restored/saved automatically (post-job step). Cold first run, then
    # ~60-80% of objects come from cache, which is where the 40 min go.
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ runner.os }}-fox${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-${{ inputs.DEVICE_TREE_BRANCH }}-${{ inputs.BUILD_TARGET }}-bust${{ inputs.CCACHE_BUST }}
        restore-keys: |
          ccache-${{ runner.os }}-fox${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-${{ inputs.DEVICE_TREE_BRANCH }}-${{ inputs.BUILD_TARGET }}-
          ccache-${{ runner.os }}-fox${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-

    - name: Set-up Manifest
      run: |
        set -euo pipefail
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        set -euo pipefail
        TREE="${{ inputs.DEVICE_TREE }}"
        BRANCH="${{ inputs.DEVICE_TREE_BRANCH }}"
        DEST="${{ inputs.DEVICE_PATH }}"
        MANIFEST_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

        echo "=== repo:   $TREE"
        echo "=== branch: $BRANCH"
        echo "=== dest:   $MANIFEST_DIR/$DEST"
        echo "=== branches that really exist in that repo:"

        if ! git ls-remote --heads "$TREE" 2>/dev/null \
             | sed -e 's#^[^\t]*\trefs/heads/##' | sort > /tmp/tree-branches.txt; then
          echo "::error::Cannot read $TREE - wrong URL, repo deleted, or it is private (needs a token in the clone URL)."
          exit 1
        fi
        sed 's/^/    - /' /tmp/tree-branches.txt

        if ! grep -Fxq "$BRANCH" /tmp/tree-branches.txt; then
          echo "::error::Branch '$BRANCH' does not exist in $TREE. Use one of the branches printed above."
          exit 1
        fi

        cd "$MANIFEST_DIR"
        rm -rf "./$DEST"
        git clone --depth 1 "$TREE" -b "$BRANCH" "./$DEST"
        cd "./$DEST"
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    - name: Extra repos (optional)
      if: inputs.EXTRA_REPOS != ''
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
        while IFS='|' read -r P URL B; do
          P="$(echo "${P:-}" | xargs)"; URL="$(echo "${URL:-}" | xargs)"; B="$(echo "${B:-}" | xargs)"
          [ -z "$P" ] && continue
          case "$P" in \#*) continue ;; esac
          echo "=== overlay $P  <-  $URL (${B:-default branch})"
          rm -rf "$P"
          if [ -n "$B" ]; then
            git clone --depth 1 -b "$B" "$URL" "$P"
          else
            git clone --depth 1 "$URL" "$P"
          fi
        done <<< "${{ inputs.EXTRA_REPOS }}"

    - name: Building OrangeFox
      run: |
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_EXEC=$(which ccache)
        ccache --zero-stats || true
        ccache --show-config || true

        set +e
        source build/envsetup.sh
        set -e
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng

        # NOTE: no 'make clean' here - the workspace is always fresh, so it only
        # parsed the whole build system for a couple of minutes and did nothing.
        set -o pipefail
        time mka ${{ inputs.BUILD_TARGET }}image 2>&1 | tee "${GITHUB_WORKSPACE}/of-build.log"

        ccache --show-stats || true

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: of-build-log-${{ github.run_attempt }}
        path: of-build.log
        if-no-files-found: ignore
        retention-days: 14

    - name: Set Release Properties
      if: success()
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
